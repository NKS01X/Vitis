name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
      - name: Build
        run: cross build --release --target ${{ matrix.target }}
      - name: Package binary
        run: |
          BINARY="vitis-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/vitis" "${BINARY}"
          tar czf "${BINARY}.tar.gz" "${BINARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: vitis-${{ matrix.target }}
          path: vitis-${{ matrix.target }}.tar.gz

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: List files
        run: ls -R
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vitis-x86_64-unknown-linux-gnu/vitis-x86_64-unknown-linux-gnu.tar.gz
            vitis-aarch64-unknown-linux-gnu/vitis-aarch64-unknown-linux-gnu.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}