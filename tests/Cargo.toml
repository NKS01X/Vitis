[workspace]
resolver = "2"
members = [
    "core",
    "parser",
    "cache",
    "export",
    "registry",
    "runtime",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
vitis-core = { path = "../crates/core" }
vitis-parser = { path = "../crates/parser" }
vitis-cache = { path = "../crates/cache" }
vitis-export = { path = "../crates/export" }
vitis-registry = { path = "../crates/registry" }
vitis-runtime = { path = "../crates/runtime" }
vitis-storage = { path = "../crates/storage" }
vitis-engine = { path = "../crates/engine" }
vitis-cli = { path = "../crates/cli", package = "vitis" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
